# Déploiement Netlify — site statique, aucune étape de build requise.
# (Le HTML est généré en local par `node build.mjs` et versionné.)
[build]
  publish = "."
  command = "node build.mjs"

# URLs propres : /debouchage → debouchage.html
[[redirects]]
  from = "/plomberie"
  to = "/plomberie.html"
  status = 200
[[redirects]]
  from = "/debouchage"
  to = "/debouchage.html"
  status = 200
[[redirects]]
  from = "/degorgement"
  to = "/degorgement.html"
  status = 200
[[redirects]]
  from = "/urgence-plomberie"
  to = "/urgence-plomberie.html"
  status = 200
[[redirects]]
  from = "/bretagne"
  to = "/bretagne.html"
  status = 200
[[redirects]]
  from = "/finistere-29"
  to = "/finistere-29.html"
  status = 200
[[redirects]]
  from = "/morbihan-56"
  to = "/morbihan-56.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 200
[[redirects]]
  from = "/politique-confidentialite"
  to = "/politique-confidentialite.html"
  status = 200
[[redirects]]
  from = "/plombier-finistere"
  to = "/finistere-29"
  status = 301
[[redirects]]
  from = "/plombier-finistere.html"
  to = "/finistere-29"
  status = 301
[[redirects]]
  from = "/plombier-morbihan"
  to = "/morbihan-56"
  status = 301
[[redirects]]
  from = "/plombier-morbihan.html"
  to = "/morbihan-56"
  status = 301
[[redirects]]
  from = "/zones-intervention"
  to = "/bretagne"
  status = 301
[[redirects]]
  from = "/zones-intervention.html"
  to = "/bretagne"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
